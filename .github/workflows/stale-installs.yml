name: Stale Install Check

# Flags properties whose widget has not sent a heartbeat in 14 days and emails
# the owner (spec §5, step 6). Runs from GitHub Actions rather than vercel.json
# because Vercel Hobby allows only daily crons and that file already holds two —
# adding a third has previously broken the whole deployment.
#
# Required repo config (Settings -> Secrets and variables -> Actions):
#   Secret   CRON_SECRET  -> same value as the CRON_SECRET env var on Vercel
#   Variable APP_URL      -> production base URL, e.g. https://firstinqueue.com

on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC daily, off-peak for Zambian traffic
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger stale install check
        # Passed as env, never interpolated into the script text: a value
        # carrying a stray CR or newline (easy to produce when copying from a
        # Windows shell) would otherwise corrupt the generated shell source and
        # kill the step under `bash -e` before any diagnostic could print.
        env:
          BASE: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE" ]; then
            echo "APP_URL repo variable is not set"; exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret is not set"; exit 1
          fi
          base=$(printf '%s' "$BASE" | tr -d '\r\n')
          secret=$(printf '%s' "$CRON_SECRET" | tr -d '\r\n')
          if ! code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            -X GET "$base/api/cron/stale-installs" \
            -H "Authorization: Bearer $secret"); then
            echo "curl failed (exit $?) hitting $base/api/cron/stale-installs"
            exit 1
          fi
          echo "HTTP $code"
          cat /tmp/body.txt
          if [ "$code" != "200" ]; then
            echo "Stale install check failed with HTTP $code"; exit 1
          fi
